<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>My Maps</h1>
    <p>Maps go below here</p>
    <div id="map-layout">
      <nav id="region-index" aria-label="Map region index">
        <h2>Regions</h2>
        <ol></ol>
      </nav>
      <div id="map">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="group" aria-label="Interactive world map">
          <g fill="#e5e9ed" stroke="#ffffff" stroke-linejoin="round" stroke-width="3">
            <path class="map-region" data-region="North America" role="button" tabindex="0" aria-pressed="false" aria-label="North America" d="m77 119 35-29 48-9 19-20 34 8 13 18 41 4 18 22 33 8 7 19-23 18-17 29-29 9-10 25-24 4-8 23-24 6-12 25-20-4-6-20-17-6-10-28-20-14-7-29-19-17-15-27-20-22-5-34zm113 112 18 11 14 26-9 16-19-9-11-26zm65-128 14-10 13 8-7 15-16 1z"/>
            <path class="map-region" data-region="South America" role="button" tabindex="0" aria-pressed="false" aria-label="South America" d="m273 250 22 13 19 30 5 29-13 28 9 23-17 36-15 34-17 35-18 16-12-19 2-31-12-29-9-32-17-25 5-26 22-22 14-34 20-26z"/>
            <path class="map-region" data-region="Europe and Asia" role="button" tabindex="0" aria-pressed="false" aria-label="Europe and Asia" d="m447 133 26-18 35-5 17 14 24-8 27 13 34-8 23 16 34-2 26 17 34 3 16 16-9 16-28 4-17 15-35-7-17 11-32-7-27 17-22-3-13 18-25-8-5-22-20-14-21-4-12-19-22-2-18-21zm69 87 20 7 10 18-12 12-18-8-8-17zm-56-69 12-17 14 5 6 18-12 8-16-4z"/>
            <path class="map-region" data-region="Africa" role="button" tabindex="0" aria-pressed="false" aria-label="Africa" d="m485 238 26-9 29 9 22 25 8 33-15 32-8 33-25 30-14 29-18-10-3-27-18-19-4-30-13-28 3-34 15-20z"/>
            <path class="map-region" data-region="Australia" role="button" tabindex="0" aria-pressed="false" aria-label="Australia" d="m707 300 29-20 34 7 24 18 37 1 24 18-5 22-34 9-22 26-31 9-20-18-27 1-19-23-13-27 7-17z"/>
            <path class="map-region" data-region="New Zealand" role="button" tabindex="0" aria-pressed="false" aria-label="New Zealand" d="m844 387 24-12 31 5 17 22-12 24-29 7-24-13-14-18z"/>
            <path class="map-region" data-region="Northeast Asia" role="button" tabindex="0" aria-pressed="false" aria-label="Northeast Asia" d="m823 96 26-16 35 7 25 21-8 27-28 7-26-13-20-17z"/>
          </g>
        </svg>
      </div>
    </div>
    <p id="map-selection" aria-live="polite">Select a region on the map.</p>
    <script>
      const regions = document.querySelectorAll(".map-region");
      const selection = document.querySelector("#map-selection");
      const regionIndex = document.querySelector("#region-index ol");
      const selectedRegions = new Set();
      const unknownRegions = [];
      const regionsByName = new Map(
        Array.from(regions, (region) => [region.dataset.region.toLowerCase(), region]),
      );

      function updateSelection() {
        regions.forEach((item) => {
          const isSelected = selectedRegions.has(item);
          item.classList.toggle("selected", isSelected);
          item.setAttribute("aria-pressed", String(isSelected));
          const indexLink = regionIndex.querySelector(`[href="#${item.id}"]`);
          indexLink.classList.toggle("selected", isSelected);
          if (isSelected) {
            indexLink.setAttribute("aria-current", "true");
          } else {
            indexLink.removeAttribute("aria-current");
          }
        });

        const selectedNames = Array.from(selectedRegions, (region) => region.dataset.region);
        selection.textContent = selectedNames.length
          ? `Selected: ${selectedNames.join(", ")}`
          : "Select a region on the map.";
        if (unknownRegions.length) {
          selection.textContent += ` Unrecognized regions in URL: ${unknownRegions.join(", ")}.`;
        }
      }

      function toggleRegion(region) {
        if (selectedRegions.has(region)) {
          selectedRegions.delete(region);
        } else {
          selectedRegions.add(region);
        }
        updateSelection();
      }

      regions.forEach((region, index) => {
        region.id = `map-region-${index + 1}`;
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.href = `#${region.id}`;
        link.textContent = region.dataset.region;
        link.addEventListener("click", (event) => {
          event.preventDefault();
          toggleRegion(region);
        });
        item.append(link);
        regionIndex.append(item);

        region.addEventListener("click", () => toggleRegion(region));
        region.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleRegion(region);
          }
        });
      });

      const requestedRegions = new URLSearchParams(window.location.search)
        .getAll("regions")
        .flatMap((value) => value.split(","))
        .map((name) => name.trim())
        .filter(Boolean);

      requestedRegions.forEach((name) => {
        const region = regionsByName.get(name.toLowerCase());
        if (region) {
          selectedRegions.add(region);
        } else if (!unknownRegions.includes(name)) {
          unknownRegions.push(name);
        }
      });

      updateSelection();
    </script>
  </body>
</html>
